[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = "growjo-server"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "grow/+/+/+/+",
    "grow/+/+/environment/+",
    "grow/test/+/heartbeat",
    "grow/test/+/system",
    "grow/test/+/camera",
  ]
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name_path = "measurement"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "site"
      rename = "site"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "room"
      rename = "room"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "plant_id"
      rename = "plant_id"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor_id"
      rename = "sensor_id"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"
      rename = "device_id"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "metric"
      rename = "metric"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "status"
      rename = "status"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "camera_id"
      rename = "camera_id"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "event_type"
      rename = "event_type"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      rename = "value"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "unit"
      rename = "unit"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "image_url"
      rename = "image_url"
      type = "string"
      optional = true

[[processors.regex]]
  namepass = ["soil", "environment", "light"]

  [[processors.regex.tags]]
    key = "plant_id"
    pattern = "^$"
    replacement = "unknown"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
